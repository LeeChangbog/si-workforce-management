name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workforce
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d workforce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify database schema and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test bootJar
      - name: Verify PostgreSQL startup and HTTP
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/workforce
          DB_USERNAME: ci_user
          DB_PASSWORD: ci_test_password
        run: |
          java -jar build/libs/*-SNAPSHOT.jar > application-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              curl --fail --silent http://localhost:8080/ > /tmp/dashboard.html
              grep -q '<html' /tmp/dashboard.html
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat application-ci.log
              exit 1
            fi
            sleep 2
          done
          cat application-ci.log
          exit 1
      - name: Verify competition demo and report on PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U ci_user -d workforce -v ON_ERROR_STOP=1 --single-transaction < src/main/resources/db/demo/client_competition_demo.sql
          docker exec -i "$POSTGRES_CONTAINER" psql -U ci_user -d workforce -v ON_ERROR_STOP=1 --tuples-only --no-align --field-separator='|' < src/main/resources/db/queries/client_competition_violations.sql > competition-actual.txt
          cat > competition-expected.txt <<'EXPECTED'
          COI001|가상개발자01|A은행|A은행 차세대|2026-03-01|2026-03-31|B은행|B은행 모바일|2026-03-15|2026-04-15|2026-03-15|2026-03-31
          COI002|가상개발자02|C보험|C보험 청구|2026-05-01|2026-05-10|D보험|D보험 계약|2026-05-10|2026-05-20|2026-05-10|2026-05-10
          COI003|가상개발자03|E물류|E물류 배송|2026-06-20|2026-06-30|F물류|F물류 창고|2026-06-25|2026-07-05|2026-06-25|2026-06-30
          EXPECTED
          diff -u competition-expected.txt competition-actual.txt
