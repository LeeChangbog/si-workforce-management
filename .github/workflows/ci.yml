name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: workforce
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d workforce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify database schema and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test bootJar
      - name: Verify PostgreSQL startup and HTTP
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/workforce
          DB_USERNAME: ci_user
          DB_PASSWORD: ci_test_password
        run: |
          java -jar build/libs/*-SNAPSHOT.jar > application-ci.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              curl --fail --silent http://localhost:8080/ > /tmp/dashboard.html
              grep -q '<html' /tmp/dashboard.html
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat application-ci.log
              exit 1
            fi
            sleep 2
          done
          cat application-ci.log
          exit 1
