services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workforce
      POSTGRES_USER: ${DB_USERNAME:-workforce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d workforce"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/workforce
      DB_USERNAME: ${DB_USERNAME:-workforce}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
